<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Complete — Cub Scout Scavenger Hunt</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="site-title">Mission Complete!</h1>
      <p class="site-subtitle">🏆 You and your den have finished the hunt.</p>
    </header>

    <div class="divider" role="presentation"><span class="sparkle">✦</span></div>

    <section class="card text-center">
      <div style="font-size:3rem; margin-bottom:0.5rem;">🏆</div>
      <h2 class="card-title" style="justify-content:center;">Great job!</h2>
      <p style="color:var(--text-body); line-height:1.6; font-size:1rem; margin-bottom:1rem;">
        Report to your den leader to collect your completion patch.
      </p>
      <a href="index.html" class="btn btn-primary">⬅ Back to Hunt HQ</a>
    </section>

    <footer class="site-footer">
      <p class="motto">Be Prepared! ⚜️</p>
      <p>Boy Scouts of America • Cub Scouts</p>
    </footer>
  </div>
</body>
</html>
